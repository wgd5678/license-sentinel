[project]
name = "license-sentinel"
version = "0.1.0"
description = "MCP server that audits Python and npm dependency licenses for compliance before you ship."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mcp", "license", "compliance", "spdx", "dependencies", "audit", "sbom", "python", "npm"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "mcp[cli]>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/wgd5678/license-sentinel"
Repository = "https://github.com/wgd5678/license-sentinel"

[project.scripts]
license-sentinel = "license_sentinel.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/license_sentinel"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE"]
